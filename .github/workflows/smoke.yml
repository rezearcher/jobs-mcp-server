name: smoke

# Live adapter canary: a real MCP client handshake + live job pull on every push
# and daily. If an ATS changes shape or a canary board goes empty, the roundtrip
# fails and an issue is opened automatically — the maintenance signal, not a silent log.
on:
  push:
    branches: [master, main]
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: MCP client roundtrip + live data
        id: test
        run: node test/roundtrip.mjs
      - name: Open maintenance issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'smoke: MCP roundtrip or live adapter failing';
            const body = [
              'The scheduled smoke test failed — an MCP roundtrip assertion or a live ATS canary did not pass.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Likely an ATS JSON shape drift or a canary board (greenhouse:stripe / recruitee:bunq) going empty. Check src/adapters.js.',
            ].join('\n');
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'smoke',
            });
            if (existing.some((i) => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['smoke'],
            });
